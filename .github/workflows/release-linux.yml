name: release-linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxtst-dev pkg-config xclip xdotool xvfb

      - name: Core tests
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -D_GNU_SOURCE \
            shared/json.c shared/skins.c shared/skins_list.c shared/history.c shared/config.c shared/tests.c \
            -o "$RUNNER_TEMP/core-test"
          "$RUNNER_TEMP/core-test"

      - name: Build
        run: |
          set -euo pipefail
          ./linux/build.sh build
          ./build/copy4paste --version

      - name: End-to-end test
        run: |
          set -euo pipefail
          xvfb-run -a --server-args="-screen 0 1440x900x24" sh linux/test-linux.sh build/copy4paste

      - name: One instance owns the history, --select reaches it
        run: |
          set -euo pipefail
          xvfb-run -a --server-args="-screen 0 1440x900x24" sh linux/test-ipc.sh build/copy4paste

      - name: A Ctrl+V taken by another application is detected
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror linux/tests/grab_ctrl_v.c -lX11 -o build/grab_ctrl_v
          xvfb-run -a --server-args="-screen 0 1440x900x24" \
            sh linux/test-x11-conflict.sh build/copy4paste build/grab_ctrl_v

      - name: Package
        run: |
          set -euo pipefail
          ./linux/package.sh build/copy4paste "${GITHUB_REF_NAME#v}" dist
          (cd dist && sha256sum copy4paste-linux-x86_64.tar.gz copy4paste_x86_64.deb > SHA256SUMS-linux && cat SHA256SUMS-linux)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILES=(dist/copy4paste-linux-x86_64.tar.gz dist/copy4paste_x86_64.deb dist/SHA256SUMS-linux)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${FILES[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${FILES[@]}" \
              --title "copy4paste ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
          fi
