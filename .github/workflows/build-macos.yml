name: build-macos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The only x86_64 macOS runner available on GitHub. Both architectures are
    # compiled here and merged with lipo.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Runner environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          uname -m
          xcrun --sdk macosx --show-sdk-version

      - name: History tests
        run: |
          set -euo pipefail
          swiftc -swift-version 5 macos/Core/HistoryStore.swift macos/Tests/main.swift -o "$RUNNER_TEMP/history-test"
          "$RUNNER_TEMP/history-test"

      - name: Build universal (Intel 10.15 + Apple Silicon 11.0)
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          APP="dist/copy4paste.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" build
          cp macos/Info.plist "$APP/Contents/Info.plist"
          cp macos/Resources/icon.icns "$APP/Contents/Resources/icon.icns"
          printf 'APPL????' > "$APP/Contents/PkgInfo"

          COMMON=(-swift-version 5 -O -sdk "$SDK"
                  -framework AppKit -framework ApplicationServices -framework CoreGraphics
                  macos/Core/HistoryStore.swift macos/Sources/main.swift)

          xcrun swiftc "${COMMON[@]}" -target x86_64-apple-macosx10.15 -o build/copy4paste-x86_64
          xcrun swiftc "${COMMON[@]}" -target arm64-apple-macosx11.0  -o build/copy4paste-arm64

          lipo -create -output "$APP/Contents/MacOS/copy4paste" \
               build/copy4paste-x86_64 build/copy4paste-arm64
          lipo -info "$APP/Contents/MacOS/copy4paste"

      - name: Verify binary and minimum versions
        run: |
          set -euo pipefail
          BIN="dist/copy4paste.app/Contents/MacOS/copy4paste"
          test -x "$BIN"
          file "$BIN"
          xcrun vtool -show-build "$BIN"
          # For targets below 10.16 the linker emits LC_VERSION_MIN_MACOSX ("version"),
          # not LC_BUILD_VERSION ("minos"). Both formats are accepted.
          xcrun vtool -show-build -arch x86_64 "$BIN" | grep -qE '(minos|version) 10\.15'
          xcrun vtool -show-build -arch arm64  "$BIN" | grep -qE '(minos|version) 11\.0'
          "$BIN" --version

      - name: Check the app icon
        run: |
          set -euo pipefail
          test -f dist/copy4paste.app/Contents/Resources/icon.icns
          file dist/copy4paste.app/Contents/Resources/icon.icns
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/copy4paste.app/Contents/Info.plist

      - name: Interface test (crosses, highlight, delete)
        run: ./dist/copy4paste.app/Contents/MacOS/copy4paste --verify-ui

      - name: Runtime test (clipboard, history, event tap)
        run: |
          set -euo pipefail
          rm -f /tmp/copy4paste-verify.log
          ./dist/copy4paste.app/Contents/MacOS/copy4paste --verify-runtime || true
          echo "--- log"
          cat /tmp/copy4paste-verify.log
          grep -q 'ENTRIES=\["VERIFY-DOS", "VERIFY-UNO"\]' /tmp/copy4paste-verify.log
          grep -q 'IS_TEXT=true' /tmp/copy4paste-verify.log

      - name: Import Developer ID certificate (if configured)
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "No certificate: signing ad hoc."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(.*\)"/\1/p' | head -1)"
          echo "Identity: $IDENTITY"
          test -n "$IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Sign and package
        shell: bash
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          set -euo pipefail
          APP="dist/copy4paste.app"
          if [ "$IDENTITY" = "-" ]; then
            codesign --force --deep --sign - "$APP"
          else
            # Hardened Runtime + timestamp: required for notarization.
            codesign --force --deep --options runtime --timestamp \
              --sign "$IDENTITY" "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | sed -n '1,12p' || true

          mkdir -p dist/dmg
          cp -R "$APP" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          # Explicit HFS+: Catalina mounts HFS+ without surprises; macOS 15 APFS does not always.
          hdiutil create -volname copy4paste -srcfolder dist/dmg \
            -fs HFS+ -format UDZO -ov dist/copy4paste-macOS-universal.dmg
          if [ "$IDENTITY" != "-" ]; then
            codesign --force --timestamp --sign "$IDENTITY" dist/copy4paste-macOS-universal.dmg
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/copy4paste-macOS-universal.zip

      - name: Notarize (if Apple credentials are present)
        if: steps.signing.outputs.identity != '-'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::warning::Signed with Developer ID but no Apple credentials: skipping notarization."
            exit 0
          fi
          xcrun notarytool submit dist/copy4paste-macOS-universal.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait
          xcrun stapler staple dist/copy4paste.app
          xcrun stapler validate dist/copy4paste.app
          rm -f dist/copy4paste-macOS-universal.zip
          ditto -c -k --sequesterRsrc --keepParent dist/copy4paste.app dist/copy4paste-macOS-universal.zip

          xcrun notarytool submit dist/copy4paste-macOS-universal.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait
          xcrun stapler staple dist/copy4paste-macOS-universal.dmg
          xcrun stapler validate dist/copy4paste-macOS-universal.dmg
          spctl --assess --type open --context context:primary-signature -v dist/copy4paste-macOS-universal.dmg

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist && shasum -a 256 copy4paste-macOS-universal.dmg copy4paste-macOS-universal.zip > SHA256SUMS && cat SHA256SUMS

      - name: Inspect the mounted DMG
        run: |
          set -euo pipefail
          hdiutil attach dist/copy4paste-macOS-universal.dmg -nobrowse -mountpoint /tmp/c4p-dmg
          diskutil info /tmp/c4p-dmg | grep -E 'File System Personality|Type \(Bundle\)'
          test -x "/tmp/c4p-dmg/copy4paste.app/Contents/MacOS/copy4paste"
          test -f "/tmp/c4p-dmg/copy4paste.app/Contents/Resources/icon.icns"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "/tmp/c4p-dmg/copy4paste.app/Contents/Info.plist"
          codesign --verify --deep --strict "/tmp/c4p-dmg/copy4paste.app"
          hdiutil detach /tmp/c4p-dmg

      - uses: actions/upload-artifact@v4
        with:
          name: copy4paste-macOS-universal
          path: |
            dist/copy4paste-macOS-universal.dmg
            dist/copy4paste-macOS-universal.zip
            dist/SHA256SUMS
          if-no-files-found: error
