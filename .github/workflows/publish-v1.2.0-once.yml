name: publish-v1.2.0-once

# Single-use dispatcher for the v1.2.0 release; remove after the release succeeds.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.2.0-once.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create v1.2.0 tag and launch existing release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main" || test "$GITHUB_REF_NAME" = "main"
          grep -q '<string>1.2.0</string>' macos/Info.plist
          grep -q '^# copy4paste 1.2.0' RELEASE_NOTES.md
          if gh release view v1.2.0 >/dev/null 2>&1; then
            echo "Release v1.2.0 already exists; nothing to do."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.2.0 >/dev/null 2>&1; then
            echo "Tag v1.2.0 already exists; will dispatch without changing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.2.0 -m "copy4paste 1.2.0 — Community Skins"
            git push origin refs/tags/v1.2.0
          fi
          gh workflow run release-macos.yml --ref v1.2.0
          echo "Dispatched release-macos.yml for v1.2.0"
