name: build-windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # A real Windows machine, so the low-level keyboard hook and SendInput are
    # exercised for real and not only under Wine.
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc zip

      - name: Toolchain
        run: |
          set -euo pipefail
          gcc --version | head -1
          windres --version | head -1

      - name: Core tests (colours, skins, imports, history, preferences)
        run: |
          set -euo pipefail
          mkdir -p build
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            shared/json.c shared/skins.c shared/skins_list.c shared/history.c shared/config.c shared/tests.c \
            -o build/core-test.exe
          ./build/core-test.exe

      - name: Build
        run: |
          set -euo pipefail
          ./windows/build.sh build
          ls -l build/copy4paste.exe

      - name: Executable only links system DLLs
        run: |
          set -euo pipefail
          objdump -p build/copy4paste.exe | grep -i "DLL Name" | sort -u

      - name: Test on Windows (panel, skins, Ctrl+V, digit, settings)
        shell: pwsh
        run: ./windows/test-windows.ps1 -Exe build/copy4paste.exe

      - name: Package
        run: |
          set -euo pipefail
          ./windows/package.sh build/copy4paste.exe 1.3.0 dist

      - uses: actions/upload-artifact@v4
        with:
          name: copy4paste-windows
          path: dist/copy4paste-windows-x64.zip
          if-no-files-found: error
